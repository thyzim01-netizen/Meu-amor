<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ma passion unique ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    text-align: center;
    padding: 20px;
    color: #fff;
    overflow-x: hidden;
}

h1 { font-size: 34px; }
h2 { font-weight: 300; }

/* CARDS */
.card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    margin: 20px auto;
    padding: 20px;
    border-radius: 20px;
    max-width: 420px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.card:hover { transform: scale(1.03); }

.destaque {
    border: 2px solid #fff;
    background: rgba(255,255,255,0.25);
}

/* INTRO */
#intro {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

#intro button {
    padding: 12px 25px;
    border: none;
    border-radius: 20px;
    background: #ff4d6d;
    color: white;
}

/* CORAÇÕES */
.heart {
    position: fixed;
    top: -10px;
    animation: fall linear infinite;
}

@keyframes fall {
    to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<div id="intro">
    <h1>Tenho algo especial pra você ❤️</h1>
    <button onclick="entrar()">Entrar</button>
</div>

<h1>❤️ Ma passion unique ❤️</h1>
<h2 id="contador"></h2>

<div id="musicas"></div>

<script>

// ENTRAR
function entrar() {
    document.getElementById("intro").style.display = "none";
    coracoes();
}

// CORAÇÕES
function coracoes() {
    setInterval(() => {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random()*100+"vw";
        heart.style.animationDuration = (Math.random()*3+2)+"s";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),5000);
    },300);
}

// CONTADOR COMPLETO
function atualizarContador() {
    let inicio = new Date(2026, 3, 30);
    let agora = new Date();

    let diff = agora - inicio;

    let dias = Math.floor(diff / (1000*60*60*24));
    let horas = Math.floor((diff / (1000*60*60)) % 24);
    let minutos = Math.floor((diff / (1000*60)) % 60);
    let segundos = Math.floor((diff / 1000) % 60);

    document.getElementById("contador").innerText =
    `${dias} dias, ${horas}h ${minutos}m ${segundos}s ❤️`;
}

setInterval(atualizarContador, 1000);
atualizarContador();

// SPOTIFY FIX
function embed(link) {
    let limpa = link.split("?")[0];
    return limpa.replace("open.spotify.com/track/", "open.spotify.com/embed/track/");
}

// MÚSICAS
let lista = [
{
texto: "Desde que você chegou na minha vida, seu amor me curou e vem me fazendo feliz, uma paixão que caiu do céu.",
link: "https://open.spotify.com/track/691336LeF13WhNb5kmCzuC",
destaque: false
},
{
texto: "E nessa vida venho percebendo que essa paixão vem amadurecendo e sendo bela, como as folhas de outono.",
link: "https://open.spotify.com/track/2aDBeapvqr3Cnjooy3whwd",
destaque: false
},
{
texto: "Mas sua beleza me inspira e me encanta, aliás, você é minha princesa, minha linda.",
link: "https://open.spotify.com/track/7KQ77xcxGBs94Ze45jWiGs",
destaque: false
},
{
texto: "E nesse vai e vem da vida eu percebi o que eu sinto por ti, afinal...",
link: "https://open.spotify.com/track/04h9o3gtRD7fvGafF7ukJj",
destaque: false
},
{
texto: "E percebo que essa paixão vem se tornando muito para mim, afinal, é...",
link: "https://open.spotify.com/track/2k818cpVCwtF1VFJPM7k7H",
destaque: false
},
{
texto: "Eu sei, meu amor, eu sei que você é o amor da minha vida, afinal, é você meu bem-querer, meu prazer sagrado, e nessa música expresso meu amor apaixonado, nossa música...",
link: "https://open.spotify.com/track/7fkIYXPqKXQ7Swnqm0GYS6",
destaque: true
},
{
texto: "E, por fim, eu venho através do meu cantor favorito lhe falar, mas com palavras não sei expressar, mas lhe garanto que eu te amo.",
link: "https://open.spotify.com/track/0ja80k9GL9aR5IZ79tQHVX",
destaque: true
}
];

let div = document.getElementById("musicas");

lista.forEach(item => {
    div.innerHTML += `
    <div class="card ${item.destaque ? 'destaque' : ''}">
        <p>${item.texto}</p>
        <iframe src="${embed(item.link)}"
        width="100%" height="80" frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media">
        </iframe>
    </div>`;
});
</script>

</body>
</html>
